## Settings file was created by plugin BetterSuppression v1.1.0
## Plugin GUID: com.lethalcompany.bettersuppression

[Local Player]

## Enable/Disable RNNoise AI Noise Suppression for your microphone input.
## RNNoise AI 기반 소음 억제 기능을 내 마이크에 활성화/비활성화합니다.
# Setting type: Boolean
# Default value: true
Enable Noise Suppression = true

## Enable volume-based Noise Gate for your microphone input. Mutes input when audio level is below threshold.
## 내 마이크에 노이즈 게이트를 활성화합니다. 소리가 설정한 수치 이하라면, 마이크 입력을 차단합니다.
# Setting type: Boolean
# Default value: true
Enable Noise Gate = true

[Remote Players]

## Enable/Disable RNNoise AI Noise Suppression for incoming voice audio from other players.
## 다른 플레이어의 마이크 음성에도 RNNoise AI 노이즈 제거를 적용합니다.
# Setting type: Boolean
# Default value: true
Enable Remote Noise Suppression = true

## Enable volume-based Noise Gate for incoming voice audio from other players.
## 다른 플레이어의 마이크 음성에도 노이즈 게이트를 적용합니다.
# Setting type: Boolean
# Default value: true
Enable Remote Noise Gate = true

[Noise Gate DSP]

## Signal level in dBFS below which the noise gate closes and begins fading out.
## 말이 끝났을 때, 소리를 자르는 기준을 정합니다.
# Setting type: Single
# Default value: -32
# Acceptable value range: From -80 to 0
Gate Close Threshold (dB) = -32

## Signal level in dBFS required to trigger the noise gate open.
## 말을 할 때, 마이크 입력에 필요한 최소 크기를 정합니다.
# Setting type: Single
# Default value: -26
# Acceptable value range: From -80 to 0
Gate Open Threshold (dB) = -26

## Time in milliseconds to fade in from muted to full audio level when gate opens.
## 마이크 입력에 필요한 소리가 충족됐을 때, 음성이 페이드 인 되는 시간입니다.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 0 to 200
Gate Attack Time (ms) = 25

## Time in milliseconds to hold the gate open after signal falls below close threshold.
## 마이크에 입력되는 소리가 임계값 이하로 떨어졌을 때, 페이드 아웃이 되기까지의 시간을 정합니다.
# Setting type: Single
# Default value: 200
# Acceptable value range: From 0 to 1000
Gate Hold Time (ms) = 200

## Time in milliseconds to fade out from full audio level to muted when gate closes.
## 마이크에 입력되는 소리가 임계값 이하로 떨어졌을 때, 페이드 아웃 되는 시간입니다.
# Setting type: Single
# Default value: 150
# Acceptable value range: From 0 to 1000
Gate Release Time (ms) = 150

[Test Mode]

## Key to toggle the in-game microphone test overlay.
## 게임 내 마이크 테스트 오버레이를 켜고 끄는 키입니다.
# Setting type: KeyCode
# Default value: F7
Test Mode Key = F7
